<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/all.min.css">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="imgs/Byte.png">

  <title>Mensagem Enviada | by.te</title>
  <meta name="description" content="Obrigado por entrar em contato com a by.te. Retornaremos em breve.">
  <meta name="robots" content="noindex, follow">
</head>
<body>
  <!-- Header -->
  <header id="header" class="performance-optimized">
    <div class="container header-container">
      <a href="/" class="logo" aria-label="By.te - Página inicial">
        <img src="imgs/Byte.png" alt="by.te logo" width="120" height="40" fetchpriority="high">
      </a>
    </div>
  </header>

  <main>
    <section class="thank-you-section">
      <div class="container">
        <div class="thank-you-content">
          <div class="thank-you-icon">
            <i class="fas fa-check-circle"></i>
          </div>
          <h1>Mensagem Enviada!</h1>
          <p>Obrigado por entrar em contato com a by.te. Retornaremos em breve.</p>
          <div class="thank-you-actions">
            <a href="/" class="cta-btn cta-btn-primary">Voltar para a página inicial</a>
            <a href="/#contact" class="cta-btn cta-btn-secondary">Enviar nova mensagem</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p class="copyright">&copy; 2025 by.te - Todos os direitos reservados</p>
        <div class="footer-social">
          <a href="#" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
          <a href="https://instagram.com/byte_ag" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
          <a href="#" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
          <a href="#" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
        </div>
      </div>
    </div>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
